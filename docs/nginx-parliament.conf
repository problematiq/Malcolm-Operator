# Arkime Parliament behind Malcolm's nginx-proxy, at https://<malcolm>/parliament/
#
# Add this to your nginx image inside the HTTPS server block of nginx.conf,
# next to the WISE include:
#
#     include /etc/nginx/nginx_arkime_wise_rt.conf;
#     include /etc/nginx/nginx_arkime_parliament.conf;   # <- this file
#
# It targets the Service the Malcolm operator creates when
# spec.arkime.parliament.enabled is true (parliament:8008). nginx resolves
# this host name when it starts, so enable Parliament before rolling out an
# nginx image containing this file.
#
# Parliament's web app is built to live under /parliament/ and calls its API
# relative to it (/parliament/api/...), so paths are passed through unchanged.
# Its page loads a few static assets with the /parliament/ prefix
# (webBasePath) that the server only serves from the root; those are
# rewritten. Users are authenticated by Malcolm exactly as for /arkime and
# passed on in X-Forwarded-User / X-Forwarded-Roles.

location = /parliament {
  return 301 $scheme://$http_host/parliament/;
}

location /parliament/ {
  include /etc/nginx/nginx_auth_rt.conf;
  rewrite ^/parliament/(static|font-awesome|public|logos)/(.*)$ /$1/$2 break;
  proxy_pass http://parliament:8008;
  proxy_redirect off;
  proxy_set_header Authorization "";
  include /etc/nginx/nginx_proxy_forward_headers.conf;
}
