name: CI

# Pull requests: build and test, and build the image without pushing it.
# Pushes to main: also publish ghcr.io/<owner>/malcolm-operator:main and :sha-<commit>.
# Tags v*: also publish :<version>, :<major>.<minor> and :latest, and the Helm
# chart as oci://ghcr.io/<owner>/charts/malcolm-operator:<version>.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Malcolm Helm chart commit the parity tests compare against. Bump it
  # deliberately: chart changes may need matching operator changes.
  MALCOLM_HELM_REF: 91937d80723190ee7df5215c078227883140612f
  HELM_VERSION: v3.22.0

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check generated code is up to date
        run: |
          make manifests generate
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run 'make manifests generate' and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run 'go fmt ./...' on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/manager ./cmd

      - name: Unit and CRD tests
        run: go test ./... -coverprofile cover.out

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Operator Helm chart tests
        run: make test-chart

      - name: Integration tests (envtest, kustomize and Helm installs)
        run: make test-envtest

      - name: Check out the Malcolm Helm chart
        uses: actions/checkout@v5
        with:
          repository: idaholab/Malcolm-Helm
          ref: ${{ env.MALCOLM_HELM_REF }}
          path: Malcolm-Helm

      - name: Helm parity tests
        run: make test-parity MALCOLM_HELM_CHART="$GITHUB_WORKSPACE/Malcolm-Helm/chart"

      - name: Build the install manifest
        run: make build-installer IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/malcolm-operator:${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: install-manifest
          path: dist/install.yaml

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/malcolm-operator" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Publish Helm chart
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/malcolm-operator --version "$version" --app-version "$version" --destination dist
          helm push "dist/malcolm-operator-${version}.tgz" "oci://ghcr.io/${owner}/charts"
