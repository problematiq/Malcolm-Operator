                    properties:
                      arkimePCAP:
                        default: /var/lib/malcolm/arkime-pcap
                        type: string
                      filescanLogs:
                        default: /var/lib/malcolm/filescan-logs
                        type: string
                      suricataLogs:
                        default: /var/lib/malcolm/suricata-logs
                        type: string
                      valkeyAOF:
                        default: /var/lib/malcolm/valkey-aof
                        type: string
                      zeekExtractedFiles:
                        default: /var/lib/malcolm/extracted-files
                        type: string
                      zeekLogs:
                        default: /var/lib/malcolm/zeek-logs
                        type: string
                    type: object
                  interfaceTweak:
                    description: InterfaceTweak disables NIC offloading and tunes
