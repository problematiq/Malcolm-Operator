    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Malcolm is a network traffic analysis tool suite deployment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MalcolmSpec defines the desired state of a Malcolm deployment.

              Every field is optional; an empty spec deploys the same set of workloads as
              the Malcolm Helm chart with its default values.yaml.
            properties:
              arkime:
                description: Arkime settings shared by the viewer and live capture.
                properties:
                  allowWiseGUIConfig:
                    description: |-
                      AllowWiseGUIConfig makes the WISE web interface editable (protected by
                      the PIN from wisePINSecret) instead of read-only.
                    type: boolean
                  autoAnalyzeUploads:
                    description: AutoAnalyzeUploads analyzes uploaded PCAP with Arkime.
                      Defaults to true.
                    type: boolean
                  cont3xt:
                    description: |-
                      Cont3xt runs Arkime Cont3xt (Service cont3xt:3218), served at /cont3xt/
                      by an nginx image that routes it there.
                    properties:
                      enabled:
                        description: Enabled deploys the application.
                        type: boolean
                    type: object
                  exposeWiseGUI:
                    description: |-
                      ExposeWiseGUI serves the WISE web interface at /wise through the nginx
                      proxy (WISE runs in the arkime pod). Defaults to true.
                    type: boolean
                  luaConfigMap:
                    description: LuaConfigMap names a ConfigMap of custom Arkime Lua
                      scripts.
                    type: string
                  parliament:
                    description: |-
                      Parliament runs Arkime Parliament (Service parliament:8008), a dashboard
                      of Arkime clusters, preconfigured with this Malcolm's Arkime. The nginx
                      image must route /parliament/ to it (see docs/nginx-parliament.conf).
                    properties:
                      enabled:
                        description: Enabled deploys the application.
                        type: boolean
                    type: object
                  passwordSecret:
                    description: PasswordSecret supplies Arkime's cluster passwordSecret;
                      generated when unset.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  wiseConfigMap:
                    description: WiseConfigMap names a ConfigMap with a "wise.ini"
                      key replacing the default.
                    type: string
                  wisePINSecret:
                    description: WisePINSecret supplies the WISE configuration GUI
                      PIN. Defaults to "WISE2019".
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  wiseServiceURL:
                    description: WiseServiceURL used by live Arkime capture. Defaults
                      to http://arkime:8081.
                    type: string
                type: object
              auth:
                description: Auth configures authentication for Malcolm's web interfaces.
                properties:
                  adminSecret:
                    description: |-
                      AdminSecret names a Secret holding the plaintext administrator
                      credentials under the keys "username" and "password". The operator
                      derives the MD5-crypt and bcrypt hashes Malcolm needs. When neither
                      adminSecret nor hashedCredentials is set, the operator generates
                      <name>-admin-credentials with username "malcolm" and a random password.
                    type: string
                  hashedCredentials:
                    description: |-
                      HashedCredentials uses a Helm-chart-compatible Secret with pre-hashed
                      credentials (Helm: auth.existingSecret) instead of adminSecret.
                    properties:
                      htpasswdKey:
                        default: htpass_cred
                        description: HtpasswdKey holds the output of htpasswd -bnB
                          <username> <password>.
                        type: string
                      opensslPasswordKey:
                        default: openssl_password
                        description: OpensslPasswordKey holds base64(openssl passwd
                          -1 <password>).
                        type: string
                      secretName:
                        description: SecretName of the Secret.
                        type: string
                      usernameKey:
                        default: username
                        type: string
                    required:
                    - secretName
                    type: object
                  ldapConfigSecret:
                    description: |-
                      LDAPConfigSecret names a Secret whose "nginx_ldap.conf" key holds the
                      nginx ldap_server configuration used when mode is ldap. A sample
                      configuration is used when empty.
                    type: string
                  mode:
                    default: basic
                    description: Mode is the authentication method for the nginx reverse
                      proxy.
                    enum:
                    - basic
                    - ldap
                    - keycloak
                    - keycloak_remote
                    - no_authentication
                    type: string
                  requireGroups:
                    description: RequireGroups lists groups a Keycloak user must belong
                      to.
                    items:
                      type: string
                    type: array
                  requireRoles:
                    description: RequireRoles lists roles a Keycloak user must hold.
                    items:
                      type: string
                    type: array
                  roleBasedAccess:
                    description: |-
                      RoleBasedAccess enables Keycloak role-based access control. Individual role
                      names can be changed via config["auth-common"] (ROLE_ADMIN, ...).
                    type: boolean
                type: object
              caTrustConfigMap:
                description: |-
                  CATrustConfigMap names a ConfigMap of PEM-encoded CA certificates that are
                  imported into every container's OS trust store. When empty, an empty
                  placeholder ConfigMap is created.
                type: string
              capture:
                description: Capture configures live network traffic capture on labeled
                  nodes.
                properties:
                  arkime:
                    description: Arkime live capture.
                    properties:
                      enabled:
                        description: Enabled creates the DaemonSet.
                        type: boolean
                      nodeHost:
                        description: NodeHost associates capture metadata with this
                          host instead of the node name.
                        type: string
                      nodeSelector:
                        additionalProperties:
                          type: string
                        description: NodeSelector picks the capture nodes.
                        type: object
                    type: object
                  filter:
                    description: Filter is a tcpdump-style capture filter.
                    type: string
                  homeNet:
                    description: |-
                      HomeNet defines local networks for Zeek (Site::local_nets) and Suricata
                      (HOME_NET). Defaults to the RFC 1918 ranges.
                    items:
                      type: string
                    type: array
                  hostPaths:
                    description: HostPaths are the node directories used by capture
